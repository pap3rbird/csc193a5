<!DOCTYPE html>
<html>
	<head>
		<title>Fancify Shamcify</title>
		<script src="fancifymytext.js"></script>
	</head>

	<body>
		<h1>Fancify my Text</h1>
		<!-- field for users to enter multi-line amounts of text -->
		<fieldset>
			<legend>Text</legend>
			<textarea id="textInput"
			rows="4" cols="30">
			</textarea>
		</fieldset>
		
		<br>

		<!-- button controls -->		
		<fieldset>
			<legend>Fancify</legend>
			
			<button onclick="makeBigger()">Bigger!</button>

			<br><br>

			<input type="radio" id="fancy" onchange="fancifyText()" name="style">
			<label for="fancy">FancyShmancy</label>
			<input type="radio" id="boring" onchange="fancifyText()" name="style">
			<label for="boring">BoringBetty</label>

			<button onclick="mooText()">Moo</button>
		</fieldset>
	</body>
</html>
